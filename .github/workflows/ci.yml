name: Tests and package smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/incident-wheel
          /tmp/incident-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/incident-wheel/bin/incident-lab list
          /tmp/incident-wheel/bin/incident-lab demo kafka-lag --output /tmp/kafka-debrief.json
          /tmp/incident-wheel/bin/incident-lab demo capacity-quota --output /tmp/capacity-debrief.json
          /tmp/incident-wheel/bin/incident-lab demo stale-recovery --output /tmp/stale-debrief.json
