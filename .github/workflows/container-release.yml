name: Container release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested Linux amd64 and arm64 images to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/narayana006/incident-rehearsal-lab

jobs:
  verify:
    name: Verify package and container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Build and exercise non-root offline image
        run: |
          docker build --build-arg REVISION="$GITHUB_SHA" --tag rehearsal:test .
          docker run --rm --read-only --network none --cap-drop ALL rehearsal:test list
          for scenario in kafka-lag capacity-quota stale-recovery; do
            docker run --rm --read-only --network none --cap-drop ALL rehearsal:test demo "$scenario" > "$scenario.json"
          done
          python - <<'PY'
          import json
          for name in ("kafka-lag", "capacity-quota", "stale-recovery"):
              with open(name + ".json") as stream:
                  result = json.load(stream)
              assert result["scenario_id"] == name and result["summary"]["proposals"] > 0
          PY
          test "$(docker image inspect --format '{{.Config.User}}' rehearsal:test)" = 10001

  publish:
    name: Publish tested multi-architecture image
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Publish after both architecture checks pass
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --metadata-file image-metadata.json --push .
          DIGEST=$(python3 -c 'import json; print(json.load(open("image-metadata.json"))["containerimage.digest"])')
          printf '### Published container\n\n`%s:%s`\n\nDigest: `%s`\n\nPlatforms: linux/amd64, linux/arm64\n' \
            "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
